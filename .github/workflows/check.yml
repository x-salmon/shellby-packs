name: Pack check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to compare against the published packs (version bumps)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate packs with Shellby's validator
        run: node scripts/validate.mjs ${{ github.event_name == 'pull_request' && format('--base origin/{0}', github.base_ref) || '' }}
      - name: Build the gallery
        run: node scripts/build.mjs
