name: Thank the pack maker

# When a pack PR is merged: thank the maker, hand them a ready-made picture of
# Shellby wearing their pack, and ask them to post it (with one-click links).
# Uses only the API on the merged commit; it never checks out or runs PR code.
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  thanks:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const SITE = 'https://x-salmon.github.io/shellby-packs/';
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, { ...context.repo, pull_number: pr.number, per_page: 100 });
            const touched = new Map(); // pack id -> added?
            for (const f of files) {
              const m = /^packs\/([a-z0-9][a-z0-9-]{1,40})\/pack\.json$/.exec(f.filename);
              if (m) touched.set(m[1], f.status === 'added');
            }
            if (!touched.size) return core.info('No packs in this PR.');

            const md = s => String(s).replace(/[\\`*_{}\[\]()#+!|<>~]/g, c => `\\${c}`).slice(0, 80);
            const sections = [];
            for (const [id, added] of touched) {
              let pack;
              try {
                const { data } = await github.rest.repos.getContent({ ...context.repo, path: `packs/${id}/pack.json`, ref: pr.merge_commit_sha });
                pack = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
              } catch { continue; } // removed in this PR
              const url = `${SITE}pack/${id}/`;
              const text = `${pack.name} by ${pack.author}: new outfits for Shellby, the pixel crab that lives on your desktop 🦀`;
              const x = `https://x.com/intent/post?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}&hashtags=ShellbyPacks`;
              const bsky = `https://bsky.app/intent/compose?text=${encodeURIComponent(`${text} ${url} #ShellbyPacks`)}`;
              sections.push([
                `### ${md(pack.name)} ${added ? 'is live!' : `v${md(pack.version)} is live!`}`,
                `It's in the gallery at ${url} (Pages takes a minute or two to publish).`,
                '',
                `<img src="${SITE}og/${id}.png" width="600" alt="Shellby wearing ${md(pack.name)}">`,
                '',
                `**Would you post your crab?** Every post helps people find Shellby, and your pack with it. That picture of Shellby wearing your pack is yours to use, and these links fill in the text for you:`,
                '',
                `**[Post on X](${x})** · **[Post on Bluesky](${bsky})**`,
              ].join('\n'));
            }
            if (!sections.length) return;
            const body = [
              `🦀 Thanks, @${pr.user.login}! Your pack is merged.`,
              '',
              sections.join('\n\n---\n\n'),
              '',
              'Tag your post **#ShellbyPacks** so we can find it and repost it. In Shellby, **📸 Share** in the Wardrobe makes a card of your own crab wearing your pack, with your trophies on it.',
            ].join('\n');
            await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
