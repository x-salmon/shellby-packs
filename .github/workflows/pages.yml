name: Publish gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git history gives each pack its "updated" date
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The gallery itself lives on getshellby.com/community: tell the site a pack
  # changed so it rebuilds now. Opt-in (add a SITE_DISPATCH_TOKEN secret, a
  # token that can write to x-salmon/shellby-site); without it the site still
  # picks the change up within 6 hours.
  tell-site:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
    steps:
      - name: Tell the website
        if: ${{ env.SITE_DISPATCH_TOKEN != '' }}
        continue-on-error: true
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${SITE_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/x-salmon/shellby-site/dispatches \
            -d '{"event_type":"packs-updated"}'
